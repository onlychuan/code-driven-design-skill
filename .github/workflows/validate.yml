name: Validate skill and installers
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_package.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/package_release.py --out release
      - uses: actions/upload-artifact@v4
        with:
          name: skill-package-${{ matrix.os }}
          path: release/*
